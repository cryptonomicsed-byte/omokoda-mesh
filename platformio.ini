; omokoda-mesh — universal ESP32 Nostr-native LoRa mesh node
; One firmware core, many boards. Board-specific pin/radio config lives in
; boards/*.h, selected via build_flags per environment. Do not fork the
; core loop per board — only the HAL layer may branch on board identity.

[platformio]
default_envs = generic_esp32_sx1262

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D OMOKODA_MESH_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    rweather/Crypto @ ^0.4.0
    bblanchon/ArduinoJson @ ^7.0.0
    jgromes/RadioLib @ ^6.6.0

; ---- Generic boards (bring-your-own radio wiring) ----

[env:generic_esp32_sx1262]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D OMOKODA_BOARD=\"generic_esp32\"
    -D OMOKODA_BOARD_GENERIC_ESP32
    -D OMOKODA_RADIO_SX1262

[env:generic_esp32s3_sx1262]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D OMOKODA_BOARD=\"generic_esp32s3\"
    -D OMOKODA_BOARD_GENERIC_ESP32
    -D OMOKODA_RADIO_SX1262

[env:generic_esp32c3_sx1276]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D OMOKODA_BOARD=\"generic_esp32c3\"
    -D OMOKODA_RADIO_SX1276

; ---- Known community boards ----

[env:heltec_v3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D OMOKODA_BOARD=\"heltec_v3\"
    -D OMOKODA_BOARD_HELTEC_V3
    -D OMOKODA_RADIO_SX1262
    -D OMOKODA_HAS_OLED

[env:ttgo_tbeam]
board = ttgo-t-beam
build_flags =
    ${env.build_flags}
    -D OMOKODA_BOARD=\"ttgo_tbeam\"
    -D OMOKODA_BOARD_TTGO_TBEAM
    -D OMOKODA_RADIO_SX1276
    -D OMOKODA_HAS_GNSS

[env:cardputer_adv]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D OMOKODA_BOARD=\"cardputer_adv\"
    -D OMOKODA_BOARD_CARDPUTER_ADV
    -D OMOKODA_RADIO_SX1262
    -D OMOKODA_HAS_KEYBOARD
    -D OMOKODA_HAS_SCREEN
